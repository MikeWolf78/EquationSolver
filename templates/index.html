<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equation Solver</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.6;
            background-color: #121212;
            color: #e0e0e0;
        }
        .result-box {
            background: #1e1e1e;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            border: 1px solid #333;
        }
        input[type="text"] {
            width: 70%;
            padding: 0.5rem;
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #ffffff;
            border-radius: 4px;
        }
        button {
            padding: 0.5rem 1rem;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
        ul { list-style-type: none; padding: 0; }
        li { margin-bottom: 0.5rem; border-left: 3px solid #007bff; padding-left: 10px; }
        code { background-color: #2c2c2c; padding: 0.2rem 0.4rem; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Quadratic Equation Solver</h1>
    <p>Enter an equation (e.g., <code>x^2 + 2x + 1 = 0</code>)</p>

    <form method="POST">
        <input type="text" name="equation" value="{{ equation }}" placeholder="" required>
        <button type="submit">Solve</button>
    </form>

    {% if steps %}
        <div class="result-box">
            <h2>Solution Steps:</h2>
            <ul>
                {% for step in steps %}
                    <li>{{ step }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}
</body>
</html>
